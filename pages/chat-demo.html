<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Fullscreen Demo</title>
    <style>
        /* Zera margens e ocupa a tela inteira */
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #f5f5f5;
        }

        /* 
           O CSS NOSSO agressivo:
           Como a página é SÓ pro chat, vamos forçar QUALQUER div que seja injetada direto 
           no corpo da página (que é o que bibliotecas como Mantine/React fazem para Popups)
           a ocupar a tela inteira. 
        */
        body > div {
            position: fixed !important;
            width: 100vw !important;
            height: 100vh !important;
            max-width: none !important;
            max-height: none !important;
            top: 0 !important;
            left: 0 !important;
            bottom: 0 !important;
            right: 0 !important;
            margin: 0 !important;
            border-radius: 0 !important;
            z-index: 999999 !important;
            display: flex !important;
            flex-direction: column !important;
        }

        /* Para os elementos internos do chat crescerem junto (Mantine components) */
        body > div > div, 
        .mantine-AppShell-root {
            width: 100% !important;
            height: 100% !important;
            max-width: none !important;
            max-height: none !important;
            flex-grow: 1 !important;
            border-radius: 0 !important;
        }

        /* Esconde o botão launcher (geralmente um botão circular) */
        body button[style*="border-radius: 50%"],
        body button[aria-label="Minimize"],
        body button[aria-label="Close"] {
            display: none !important;
        }
    </style>
</head>

<body>
    <script>
        (function () {
            const styleEl = document.createElement("style");
            styleEl.textContent = `
              df-messenger {
                --df-messenger-window-font-family: inter;
                --df-messenger-button-titlebar-font-color: #000000;
                --df-messenger-button-titlebar-subtitle-color: #000000;
                --df-messenger-form-button-background-color: rgba(30, 86, 216, 1);
                --df-messenger-form-button-text-color: #ffffff;
                --df-messenger-form-file-input-button-text-color: rgba(30, 86, 216, 1);
                --df-messenger-article-source-button-color: rgba(30, 86, 216, 1);
                --df-messenger-article-source-button-hover-color: rgba(24, 69, 173, 1);
                --df-messenger-input-border-color: rgba(30, 86, 216, 1);
                --df-messenger-send-icon-active-color: #ffffff;
                --df-messenger-send-icon-background-active-color: rgba(30, 86, 216, 1);
                --ai-message-agent-waiting-response-icon-background-color: #205AE3;
              }
            `;
            document.head.appendChild(styleEl);

            const urlParams = new URLSearchParams(window.location.search);
            const surveyId = urlParams.get('survey_id');
            const customerId = urlParams.get('customer_id');

            const dfMessenger = document.createElement("df-messenger");
            dfMessenger.setAttribute("auto-start", "true");
            dfMessenger.setAttribute("hide-kb-sources", "true");
            dfMessenger.setAttribute("launcher-visibility", "prominent");
            dfMessenger.setAttribute("ui-roundness", "oval");
            dfMessenger.setAttribute("selected-theme", "vibrant");
            dfMessenger.setAttribute("auth-client-id", "0va-019f709b-c08e-710b-8606-710-ic0jkbc9");
            dfMessenger.setAttribute("recaptcha-site-key", "6LdzolUtAAAAACh6KayVe_phw3uUd9IQ9CPu4aEN");
            dfMessenger.setAttribute("recaptcha-checkbox-site-key", "6LcYjFUtAAAAAFXQhWD-ylOslwqNKLv0yeuXL1Jg");
            dfMessenger.setAttribute("crestagpt-customer", "smttech");
            dfMessenger.setAttribute("crestagpt-profile", "us-west-2");
            dfMessenger.setAttribute("crestagpt-usecase", "voice");
            dfMessenger.setAttribute("crestagpt-agent", "019f709b-c08e-710b-8606-710709de1d6f");
            dfMessenger.setAttribute("crestagpt-api", "https://api-smttech.cresta.com");
            dfMessenger.setAttribute("crestagpt-auth-endpoint", "https://auth.us-west-2-prod.cresta.com");
            dfMessenger.setAttribute("powered-by-cresta", "false");
            dfMessenger.setAttribute("show-chat-window-shadow", "false");
            dfMessenger.setAttribute("render-transfer-to-human-agent-indicator", "false");

            if (surveyId) {
                dfMessenger.setAttribute("user-id", customerId || "");
                // Tentativa de passar variavel via atributos
                dfMessenger.setAttribute("crestagpt-variable-survey_id", surveyId);
                dfMessenger.setAttribute("crestagpt-variable-customer_id", customerId || "");
            }
            
            document.body.appendChild(dfMessenger);

            const script = document.createElement("script");
            script.type = "module";
            script.src = "https://va-widget.us-west-2-prod.cresta.ai/ai-agent-widget/index.js";
            document.body.appendChild(script);
        })();
    </script>
</body>

</html>

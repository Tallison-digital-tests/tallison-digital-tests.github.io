<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Fullscreen Demo</title>
    <style>
        /* Zera margens e ocupa a tela inteira */
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #f5f5f5;
            /* Cor de fundo opcional */
        }

        /* Regras para forçar a janela interna de chat a ser full screen */
        df-messenger {
            --df-messenger-window-width: 100vw !important;
            --df-messenger-window-height: 100vh !important;
            --df-messenger-window-margin: 0 !important;
            --df-messenger-chat-window-width: 100vw !important;
            --df-messenger-chat-window-height: 100vh !important;
            --df-messenger-chat-window-margin: 0 !important;
        }
    </style>
</head>
<body>
    <script>
        (function () {
            const styleEl = document.createElement("style");
            styleEl.textContent = `
                df-messenger {
                    --df-messenger-window-font-family: inter;
                    --df-messenger-button-titlebar-font-color: #000000;
                    --df-messenger-button-titlebar-subtitle-color: #000000;
                    --df-messenger-form-button-background-color: rgba(30, 86, 216, 1);
                    --df-messenger-form-button-text-color: #ffffff;
                    --df-messenger-form-file-input-button-text-color: rgba(30, 86, 216, 1);
                    --df-messenger-article-source-button-color: rgba(30, 86, 216, 1);
                    --df-messenger-article-source-button-hover-color: rgba(24, 69, 173, 1);
                    --df-messenger-input-border-color: rgba(30, 86, 216, 1);
                    --df-messenger-send-icon-active-color: #ffffff;
                    --df-messenger-send-icon-background-active-color: rgba(30, 86, 216, 1);
                    --ai-message-agent-waiting-response-icon-background-color: #205AE3;
                }
            `;
            document.head.appendChild(styleEl);

            const dfMessenger = document.createElement("df-messenger");
            dfMessenger.setAttribute("ui-roundness", "oval");
            dfMessenger.setAttribute("selected-theme", "vibrant");
            dfMessenger.setAttribute("auth-client-id", "0va-019f709b-c08e-710b-8606-710-ic0jkbc9");
            dfMessenger.setAttribute("recaptcha-site-key", "6LdzolUtAAAAACh6KayVe_phw3uUd9IQ9CPu4aEN");
            dfMessenger.setAttribute("recaptcha-checkbox-site-key", "6LcYjFUtAAAAAFXQhWD-ylOslwqNKLv0yeuXL1Jg");
            dfMessenger.setAttribute("crestagpt-customer", "smttech");
            dfMessenger.setAttribute("crestagpt-profile", "us-west-2");
            dfMessenger.setAttribute("crestagpt-usecase", "voice");
            dfMessenger.setAttribute("crestagpt-agent", "019f709b-c08e-710b-8606-710709de1d6f");
            dfMessenger.setAttribute("crestagpt-api", "https://api-smttech.cresta.com");
            dfMessenger.setAttribute("crestagpt-auth-endpoint", "https://auth.us-west-2-prod.cresta.com");
            
            // Atributos adicionais para tentar iniciar o chat já aberto (depende da implementação do widget)
            dfMessenger.setAttribute("expand", "true"); 

            document.body.appendChild(dfMessenger);

            const script = document.createElement("script");
            script.type = "module";
            script.src = "https://va-widget.us-west-2-prod.cresta.ai/ai-agent-widget/index.js";
            document.body.appendChild(script);

            // Script para injetar CSS no Shadow DOM focado no componente da Cresta (Mantine UI)
            const injectShadowStyles = () => {
                const df = document.querySelector("df-messenger");
                if (df && df.shadowRoot && !df.shadowRoot.querySelector('#fullscreen-override')) {
                    const style = document.createElement("style");
                    style.id = 'fullscreen-override';
                    style.innerHTML = `
                        /* Tenta forçar o primeiro container principal (e o próprio widget) a ocupar 100% da tela */
                        :host > div, 
                        :host > main,
                        .mantine-AppShell-root {
                            width: 100vw !important;
                            height: 100vh !important;
                            max-width: none !important;
                            max-height: none !important;
                            border-radius: 0 !important;
                            margin: 0 !important;
                            position: fixed !important;
                            bottom: 0 !important;
                            right: 0 !important;
                            top: 0 !important;
                            left: 0 !important;
                            z-index: 999999 !important;
                        }
                        
                        /* Oculta o botão flutuante caso a janela já esteja aberta */
                        :host > button {
                            display: none !important;
                        }
                    `;
                    df.shadowRoot.appendChild(style);
                }
            };

            const intervalId = setInterval(() => {
                const df = document.querySelector("df-messenger");
                if (df && df.shadowRoot && df.shadowRoot.innerHTML.length > 0) {
                    injectShadowStyles();
                    clearInterval(intervalId);
                }
            }, 500);

        })();
    </script>
</body>
</html>
